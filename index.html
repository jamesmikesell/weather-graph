<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Explore seven days of National Weather Service grid forecasts for any location in the United States.">
  <title>Graph WX</title>
  <meta name="theme-color" content="#101722">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Graph WX">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/weather-grid-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/weather-grid-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin>
  <link rel="stylesheet" href="styles.css?v=13">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin defer></script>
  <script type="module" src="app.js?v=46"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand"><img class="brand-mark" src="icons/weather-grid-64.png" width="34" height="34" alt=""><span>Graph WX</span></div>
      <label class="theme">Appearance
        <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select>
      </label>
    </div>
  </header>
  <main class="wrap">
    <div class="dashboard">
      <details id="location-panel" class="location card">
        <summary>Location &amp; Radar</summary>
        <div class="search">
          <input id="city" type="search" aria-label="City and state" placeholder="Search U.S. cities" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" autocomplete="off">
          <ul id="suggestions" role="listbox" hidden></ul>
        </div>
        <p id="search-status" class="sr-only" role="status"></p>
        <p id="location-status" class="muted" role="status" hidden></p>
        <div id="map-home">
          <div id="map-view">
            <div class="map-wrap">
              <div id="map" aria-label="Map for choosing a forecast location"></div>
              <button id="expand-map" class="map-icon map-expand" type="button" aria-label="Expand map" title="Expand map" aria-expanded="false" aria-controls="map-dialog" hidden>
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path class="expand-icon" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"></path>
                  <path class="collapse-icon" d="M4 9h5V4m11 5h-5V4M4 15h5v5m11-5h-5v5"></path>
                </svg>
              </button>
              <button id="locate" class="map-icon map-locate" type="button" aria-label="Use my location" title="Use my location">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="7"></circle>
                  <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"></circle>
                  <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
                </svg>
              </button>
            </div>
            <div id="radar-controls" hidden>
              <div class="radar-source">
                <a href="https://radar.weather.gov/">NOAA/NWS radar</a>
                <time id="radar-time"></time>
              </div>
              <button id="radar-playback" type="button" disabled>Pause radar</button>
            </div>
          </div>
        </div>
      </details>
      <section class="forecast card" aria-labelledby="place">
        <div class="forecast-heading">
          <div><h2 id="place">Local forecast</h2><p id="metadata" class="muted" hidden></p></div>
          <button id="refresh" type="button" hidden>Refresh</button>
        </div>
        <section id="conditions" aria-labelledby="conditions-heading" aria-live="polite" hidden>
          <h3 id="conditions-heading">Current conditions</h3>
          <p id="conditions-values"></p>
          <p id="conditions-source" class="muted"></p>
        </section>
        <div id="range" class="range" role="group" aria-label="Forecast length" hidden></div>
        <p id="forecast-status" role="status">Finding your location…</p>
        <div id="chart" hidden>
          <div id="plot" tabindex="0" aria-label="Forecast graph. Tap the graph or use the arrow keys to inspect hourly values. In shorter views, drag or hold Shift and use the arrow keys to pan."></div>
          <div id="tooltip" hidden></div>
          <p id="legend-hint" class="muted">Select a series to show or hide it on the graph.</p>
          <div id="legend" role="group" aria-label="Forecast series" aria-describedby="legend-hint"></div>
          <p id="chart-readout" class="sr-only" aria-live="polite"></p>
        </div>
      </section>
    </div>
  </main>
  <dialog id="map-dialog" aria-label="Expanded radar map"></dialog>
</body>
</html>
